name: Post to Threads

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

concurrency:
  group: post
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Post the next item if a slot is due
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL }}
        run: node scripts/post.mjs
      - name: Save the posting history
        if: always()
        run: |
          if ! git diff --quiet state.json; then
            git config user.name "framy-bot"
            git config user.email "framy-bot@users.noreply.github.com"
            git add state.json
            git commit -m "Posted to Threads"
            git push
          fi
